function blockHTML(b){if(b.type==='info')return `<div class="info-row"><label class="${esc(b.color||'')}">${esc(b.label)}</label><div>${esc(b.text)}</div></div>`;if(b.type==='note')return `<div class="info-row"><label class="graynote">${esc(b.label)}</label><div>${esc(b.text)}</div></div>`;if(b.type==='bar')return `<div class="bar">${esc(b.text)}</div>`;if(b.type==='paragraph')return `<div class="para">${esc(b.text)}</div>`;if(b.type==='image')return b.url?`<figure class="figure"><img loading="lazy" src="${esc(b.url)}"><figcaption class="cap">${esc(b.caption||'')}</figcaption></figure>`:'';if(b.type==='gallery')return `<div class="gallery" style="grid-template-columns:repeat(${b.cols||2},1fr)">${(b.images||[]).filter(x=>x.url).map(x=>`<figure style="margin:0"><img loading="lazy" src="${esc(x.url)}"><figcaption class="cap">${esc(x.caption||'')}</figcaption></figure>`).join('')}</div>`;if(b.type==='table')return `<div class="table-scroll"><table class="data"><thead><tr>${(b.headers||[]).map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${(b.rows||[]).map(row=>`<tr>${row.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;if(b.type==='lifecycle')return blockLifecycleHTML(b);if(b.type==='jaw3')return blockJawHTML(b);if(b.type==='grid6')return blockGrid6HTML(b);return ''}

function blockBlank(type){if(type==='info')return{type,label:'',text:'',color:'blue'};if(type==='note')return{type,label:'',text:''};if(type==='bar'||type==='paragraph')return{type,text:''};if(type==='image')return{type,url:'',caption:''};if(type==='gallery')return{type,cols:2,images:[]};if(type==='lifecycle')return{type,images:{egg:'',larva1:'',larva2:'',larva3:'',pupa_m:'',pupa_f:'',adult_m:'',adult_f:''}};if(type==='jaw3')return{type,images:{short:'',mid:'',long:''}};if(type==='grid6')return{type,images:['','','','','','']};return{type,headers:['항목','내용'],rows:[['','']]}}

function captureBlocks(){document.querySelectorAll('.editor-block').forEach((node,i)=>{let b=blocks[i];node.querySelectorAll('[data-k]').forEach(f=>{let v=f.value;if(f.dataset.k==='cols')v=+v;if(f.dataset.k==='headers')v=v.split('|').map(x=>x.trim());if(f.dataset.k==='rows')v=v.split('\n').filter(Boolean).map(x=>x.split('|').map(y=>y.trim()));if(f.dataset.k==='images')v=v.split('\n').filter(Boolean).map(x=>{let [url,...rest]=x.split('|');return{url:url.trim(),caption:rest.join('|').trim()}});b[f.dataset.k]=v})})}
function showBlocks(){let root=$('blocklist');root.innerHTML=blocks.map((b,i)=>`<section class="editor-block" data-idx="${i}"><header><b>${i+1}. ${esc(({info:'색상 정보 행',note:'회색 정보 행',bar:'구분 제목줄',paragraph:'본문',image:'사진',gallery:'사진 묶음',table:'표',lifecycle:'성장/변태 과정',jaw3:'크기별 턱 형태',grid6:'3x2 사진표'})[b.type])}</b><div class="flex"><button class="btn ghost" data-move="up" data-i="${i}">↑</button><button class="btn ghost" data-move="down" data-i="${i}">↓</button><button class="btn danger" data-move="remove" data-i="${i}">×</button></div></header>${blockForm(b)}</section>`).join('');root.querySelectorAll('[data-move]').forEach(el=>el.onclick=()=>{captureBlocks();let i=+el.dataset.i;if(el.dataset.move==='remove')blocks.splice(i,1);if(el.dataset.move==='up'&&i)[blocks[i-1],blocks[i]]=[blocks[i],blocks[i-1]];if(el.dataset.move==='down'&&i<blocks.length-1)[blocks[i+1],blocks[i]]=[blocks[i],blocks[i+1]];showBlocks()});root.querySelectorAll('[data-file]').forEach(el=>el.onchange=async()=>{let i=+el.closest('[data-idx]').dataset.idx;captureBlocks();try{let files=Array.from(el.files),urls=[];for(const file of files)urls.push(await uploadPhoto(file));if(blocks[i].type==='image')blocks[i].url=urls[0];else if(blocks[i].type==='gallery')blocks[i].images.push(...urls.map(url=>({url,caption:''})));showBlocks()}catch(e){alert('사진 업로드 실패: '+e.message)}});root.querySelectorAll('[data-special]').forEach(el=>el.onchange=async()=>{let i=+el.closest('[data-idx]').dataset.idx;captureBlocks();try{let file=el.files[0];if(!file)return;let url=await uploadPhoto(file),key=el.dataset.special,b=blocks[i];if(b.type==='lifecycle'||b.type==='jaw3'){b.images=b.images||{};b.images[key]=url}else if(b.type==='grid6'){b.images=b.images||['','','','','',''];b.images[+key]=url}showBlocks()}catch(e){alert('사진 업로드 실패: '+e.message)}});root.querySelectorAll('[data-clear]').forEach(el=>el.onclick=()=>{let i=+el.closest('[data-idx]').dataset.idx;captureBlocks();let key=el.dataset.clear,b=blocks[i];if(b.type==='lifecycle'||b.type==='jaw3'){b.images[key]=''}else if(b.type==='grid6'){b.images[+key]=''}showBlocks()})}
async function uploadPhoto(file){if(file.size>8*1024*1024)throw Error('8MB 이하 사진만 업로드할 수 있어.');if(!file.type.startsWith('image/'))throw Error('이미지 파일만 허용해.');if(mode==='online'){let key=uid()+'.'+(file.type.split('/')[1]||'jpg').replace('jpeg','jpg');let{data:out,error}=await backend.storage.from('report-images').upload(key,file,{upsert:false,contentType:file.type});if(error)throw error;return backend.storage.from('report-images').getPublicUrl(out.path).data.publicUrl}return await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}

n ghost" data-add="${id}" type="button">+ ${label}</button>`).join('')}</div><div class="flex spaced"><button class="btn" type="submit">게시글 저장</button><button class="btn ghost" id="preview" type="button">본문 미리보기</button></div><div id="previewarea"></div></form>`;$('cancel').onclick=()=>go('all');$('app').querySelectorAll('[data-add]').forEach(el=>el.onclick=()=>{captureBlocks();blocks.push(blockBlank(el.dataset.add));showBlocks()});$('app').querySelectorAll('[data-template]').forEach(el=>el.onclick=()=>injectTemplate(el.dataset.template));$('coverfile').onchange=async e=>{if(e.target.files[0]){try{$('write').elements.cover.value=await uploadPhoto(e.target.files[0]);alert('대표 사진이 등록됐어. 저장 버튼을 누르면 게시돼.')}catch(err){alert(err.message)}}};$('preview').onclick=()=>{captureBlocks();$('previewarea').innerHTML=`<div class="editor-preview">${bodyHTML(blocks)}</div>`};$('write').onsubmit=async e=>{e.preventDefault();captureBlocks();let form=e.target;let v={};form.querySelectorAll('[data-k]').forEach(el=>{if(!el.closest('.editor-block'))v[el.dataset.k]=el.value});let title=v.title.trim();if(!title){alert('제목을 입력해 줘.');return}let item={id:p?.id||uid(),title,type:v.type,taxon_id:v.taxon_id||null,scientific:v.scientific,korean:v.korean,aliases:v.aliases,locality:v.locality,summary:v.summary,cover:form.elements.cover.value,published:v.published==='true',blocks:structuredClone(blocks),created_at:p?.created_at||today(),updated_at:today()};try{await saveRow('posts',item);go('post:'+item.id)}catch(err){alert('저장 실패: '+err.message)}};showBlocks()}

// Anonymous visitors may insert approved comments; RLS enforces allowed fields and post status.
async function addRow(table,item){
  if(mode==='online'){
    const {error}=await backend.from(table).insert(item);
    if(error)throw error;
    // Show successfully submitted comments immediately.
    if(Array.isArray(data[table]))data[table].push(item);
    return;
  }
  if(!Array.isArray(data[table]))throw Error('잘못된 데이터 종류');
  data[table].push(item);
  saveLocal();
}
async function saveRow(table,item){if(mode==='online'){let {error}=await backend.from(table==='taxa'?'taxa':table).upsert(item,{onConflict:'id'});if(error)throw error}let ar=data[table],i=ar.findIndex(x=>String(x.id)===String(item.id));if(i>=0)ar[i]=item;else ar.push(item);if(mode==='offline')saveLocal()}
async function updateRow(table,id,fields){let v=data[table].find(x=>String(x.id)===String(id));if(!v)throw Error('찾을 수 없는 데이터');await saveRow(table,{...v,...fields})}
async function removeRow(table,id){if(mode==='online'){let{error}=await backend.from(table).delete().eq('id',id);if(error)throw error}data[table]=data[table].filter(x=>String(x.id)!==String(id));if(mode==='offline')saveLocal()}
function loginPage(){if(mode==='offline'){admin=!admin;$('adminbutton').textContent=admin?'미리보기 관리자 종료':'관리자';draw();return}if(admin){backend.auth.signOut().then(()=>{admin=false;authUser=null;draw()});return}$('app').innerHTML=`<button class="close-link" id="back">← 돌아가기</button><h1>관리자 로그인</h1><div class="notice">관리자 등록이 완료된 계정만 글을 작성하거나 댓글을 관리할 수 있어.</div><form class="panel" id="loginform"><label class="field">이메일<input name="email" type="email" required autocomplete="username"></label><label class="field">비밀번호<input name="password" type="password" required autocomplete="current-password"></label><button class="btn">로그인</button><div id="loginmsg" class="small"></div></form>`;$('back').onclick=()=>go('all');$('loginform').onsubmit=async e=>{e.preventDefault();let f=e.target;let{data:res,error}=await backend.auth.signInWithPassword({email:f.email.value,password:f.password.value});if(error){$('loginmsg').textContent=error.message;return}await refreshAdmin();go('all')}}
async function refreshAdmin(){if(mode==='offline')return;let{data:r}=await backend.auth.getUser();authUser=r.user;admin=false;if(authUser){let{data:a,error}=await backend.from('site_admins').select('user_id').eq('user_id',authUser.id).maybeSingle();admin=!!a&&!error}$('adminbutton').textContent=admin?'관리자 로그아웃':'관리자'}
async function initOnline(){try{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';await new Promise((ok,bad)=>{s.onload=ok;s.onerror=bad;document.head.appendChild(s)});backend=window.supabase.createClient(CONFIG.supabaseUrl,CONFIG.supabaseAnonKey);mode='online';await refreshAdmin();let[r1,r2,r3]=await Promise.all([backend.from('taxa').select('*').order('sort_order'),backend.from('posts').select('*').order('created_at',{ascending:false}),backend.from('comments').select('*').order('created_at',{ascending:false})]);if(r1.error||r2.error||r3.error)throw Error([r1.error?.message,r2.error?.message,r3.error?.message].filter(Boolean).join(' / '));data={taxa:r1.data||[],posts:r2.data||[],comments:r3.data||[]};$('mode').textContent='온라인';draw()}catch(e){$('mode').textContent='연결 오류';$('app').innerHTML=`<h1>연결 확인이 필요해</h1><div class="notice warn">데이터베이스 연결에 실패했어: ${esc(e.message)}</div><p>배포용 설정과 SQL 실행을 확인해 줘.</p>`}}
function draw(){menu();$('adminbutton').textContent=admin?(mode==='offline'?'미리보기 관리자 종료':'관리자 로그아웃'):'관리자';$('mode').textContent=mode==='offline'?'로컬 미리보기':'온라인';if(filter.startsWith('post:'))detail(filter.slice(5));else drawList();if(mode==='offline'&&!admin&&filter==='all'){let x=document.createElement('div');x.className='notice warn';x.textContent='이 파일은 오프라인 체험판이야. 관리자 버튼으로 글 작성과 사진 첨부를 시험할 수 있지만, 실제 방문자와 데이터가 공유되지는 않아.';$('app').prepend(x)}}
$('logo').onclick=()=>go('all');$('hamb').onclick=()=>{$('side').classList.toggle('show');$('scrim').classList.toggle('show')};$('scrim').onclick=closeSide;$('adminbutton').onclick=loginPage;
if(CONFIG.supabaseUrl&&CONFIG.supabaseAnonKey){initOnline()}else{loadLocal();mode='offline';draw()}
</script></body></html>
